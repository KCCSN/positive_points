<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Remote & Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    
    <style>
        body { margin: 0; font-family: 'Fredoka', sans-serif; background: #222; color: white; text-align: center; }
        header { background: #ff4b72; padding: 15px; font-size: 1.5rem; font-weight: 800; }
        
        #mainAppView { display: block; }
        #mobileVaultView { display: none; flex-direction: column; height: 100vh; background: #222; overflow: hidden; }

        .remote-bar { background: #333; padding: 15px; display: flex; gap: 8px; justify-content: center; }
        .btn-remote { border: none; padding: 15px 10px; font-size: 1.1rem; font-family: 'Fredoka'; font-weight: 800; border-radius: 10px; cursor: pointer; flex: 1; }
        .btn-vault { background: #FFD166; color: #333; } .btn-reveal { background: #06D6A0; color: white; } .btn-close { background: #555; color: white; }
        
        .auto-toggle { margin: 15px; padding: 15px; background: #444; border-radius: 20px; border: 4px solid #555; cursor: pointer; transition: 0.2s; }
        .auto-toggle h2 { margin: 0; font-size: 1.6rem; }
        .auto-on { background: #06D6A0; border-color: white; color: black; box-shadow: 0 0 20px rgba(6, 214, 160, 0.5); }

        #scannerView { padding: 15px; }
        #reader { border-radius: 15px; overflow: hidden; background: #000; min-height: 250px; border: 4px solid #444;}
        .kiosk-status-text { color: #aaa; font-size: 1.2rem; margin-top: 15px; font-weight: 600; }

        #actionPanel { display: none; background: white; color: #333; margin: 15px; padding: 30px 20px; border-radius: 20px; }
        #scanAvatar { width: 120px; height: 120px; border-radius: 50%; border: 6px solid #ff4b72; margin-bottom: 10px; background: white;}
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { border: none; padding: 15px 20px; font-size: 1.8rem; font-family: 'Fredoka'; font-weight: 800; border-radius: 15px; cursor: pointer; color: white; flex: 1; }
        .btn-1 { background: #4CAF50; } .btn-2 { background: #2196F3; }
        .btn-custom { background: #9C27B0; flex: 1; font-size: 1.5rem; }

        .custom-input-wrap { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .custom-input { width: 80px; font-size: 1.5rem; font-family: 'Fredoka'; font-weight: 700; text-align: center; border-radius: 15px; border: 3px solid #ddd; outline: none; }
        
        #saveMessage { font-size: 1.2rem; font-weight: 800; padding: 15px; border-radius: 10px; display: none; margin-top: 15px; }
        .msg-success { background: #d4edda; color: #155724; }
        .btn-cancel { background: transparent; color: #aaa; border: 3px solid #aaa; padding: 10px 20px; border-radius: 50px; font-size: 1.2rem; margin-top: 20px; width: 100%; cursor: pointer; font-family: 'Fredoka'; font-weight: 600;}
        
        /* VAULT SCROLLING UI */
        .vault-list-container { flex: 1; overflow-y: auto; background: #333; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .vault-winner-card { background: white; color: black; border-radius: 10px; padding: 10px 15px; display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 1.3rem; box-shadow: 0 4px 0 #111;}
        .vault-winner-card img { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #222; background: white;}
    </style>
</head>
<body>

    <div id="mainAppView">
        <header>📱 Teacher Hybrid Remote</header>
        
        <div class="remote-bar">
            <button class="btn-remote btn-vault" onclick="sendRealtimeCommand('showVault'); openPrizeVaultLocal();">🎁 Vault</button>
            <button class="btn-remote btn-reveal" onclick="sendRealtimeCommand('revealVault'); revealPrizeVaultLocal();">🎉 Reveal</button>
        </div>

        <div id="autoToggleBtn" class="auto-toggle" onclick="toggleAutoMode()">
            <h2 id="autoToggleText">▶️ Turn ON Auto-Check-In</h2>
        </div>

        <div id="scannerView">
            <div id="reader"></div>
            <div class="kiosk-status-text" id="kioskStatusMsg">...or waiting for laptop kiosk scan...</div>
        </div>

        <div id="actionPanel">
            <img id="scanAvatar" src="">
            <h2 id="scanName" style="font-size: 2.5rem; margin: 0;">Name</h2>
            
            <div style="font-size: 1.5rem; color: #555; margin-top: 10px; font-weight: 800;">
                Current: <span id="scanPoints" style="color: #FFD166; text-shadow: 1px 1px 0px #333;">⭐ 0</span>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-1" onclick="submitPoints(1)">+1</button>
                <button class="btn btn-2" onclick="submitPoints(2)">+2</button>
            </div>

            <div class="custom-input-wrap">
                <input type="number" id="customAmount" class="custom-input" placeholder="+/-">
                <button class="btn btn-custom" onclick="submitCustomPoints()">Send</button>
            </div>

            <div id="saveMessage">Saving...</div>
            <button class="btn-cancel" onclick="resetRemote()">Cancel / Back to Camera</button>
        </div>
    </div>

    <div id="mobileVaultView">
        <header style="background: #FFD166; color: #333;">🎁 Prize Vault Control</header>
        
        <div id="vaultLockedState" style="flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
            <h1 style="font-size: 5rem; margin:0;">🔒</h1>
            <h2 style="color: #aaa;">Vault is on the Big Screen</h2>
            <button class="btn-remote btn-reveal" style="padding: 20px; font-size: 2rem; width: 100%; margin-top: 20px;" onclick="sendRealtimeCommand('revealVault'); revealPrizeVaultLocal();">🎉 Reveal Winners</button>
        </div>

        <div id="vaultRevealedState" style="display: none; flex-direction: column; padding: 20px; flex: 1; min-height: 0;">
            <h2 style="color: #FFD166; margin-top: 0; font-size: 2rem;">🏆 15-Point Club</h2>
            <div id="mobileWinnerList" class="vault-list-container" onscroll="syncVaultScroll(event)">
                </div>
        </div>

        <div style="padding: 20px;">
            <button class="btn-cancel" style="width: 100%; border-color: #FFD166; color: #FFD166; margin: 0;" onclick="sendRealtimeCommand('closeVault'); closePrizeVaultLocal();">✖ Close Vault Everywhere</button>
        </div>
    </div>

    <script>
        // ⚠️ PASTE YOUR KEYS AND URL HERE ⚠️
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlTv6HfOVB_AFua7XKePmCySDo5VsJeRpdF4jTgjt3nSm9v3Iz1pTdhO1GwkELAKNdhQ/exec";
        const PUBNUB_PUBLISH_KEY = "pub-c-88fdc434-b3b5-4eae-963f-2ad1eac8d271";
        const PUBNUB_SUBSCRIBE_KEY = "sub-c-dfcda561-cd3f-48c6-8fba-e3ff29235b19";

        const pubnub = new PubNub({ publishKey: PUBNUB_PUBLISH_KEY, subscribeKey: PUBNUB_SUBSCRIBE_KEY, userId: "teacher_phone" });
        pubnub.subscribe({ channels: ["classroom_channel"] });

        let students = []; let activeStudentName = 'none'; let isAutoMode = 'off'; let html5QrcodeScanner = null;
        let scrollTimeout = null;

        pubnub.addListener({
            message: function(event) {
                if (event.message.action === "setActive" && isAutoMode === 'off') {
                    activeStudentName = event.message.name;
                    const student = students.find(s => s.Name.toLowerCase() === activeStudentName.toLowerCase());
                    if (student) showActionPanel(student);
                }
                else if (event.message.action === "showVault" || event.message.action === "triggerVault") openPrizeVaultLocal();
                else if (event.message.action === "revealVault") revealPrizeVaultLocal();
                else if (event.message.action === "closeVault") closePrizeVaultLocal();
                // KEEP PHONE ARRAY IN SYNC WITH POINTS
                else if (event.message.action === "addPoints") {
                    const student = students.find(s => s.Name.toLowerCase() === event.message.name.toLowerCase());
                    if (student) student.Points = parseInt(student.Points) + event.message.points;
                }
            }
        });

        function syncVaultScroll(e) {
            if (scrollTimeout) return;
            scrollTimeout = setTimeout(() => {
                const maxScroll = e.target.scrollHeight - e.target.clientHeight || 1;
                const pct = e.target.scrollTop / maxScroll;
                pubnub.publish({ channel: "classroom_channel", message: { action: "scrollVault", percent: pct } });
                scrollTimeout = null;
            }, 100); 
        }

        function openPrizeVaultLocal() {
            document.getElementById('mainAppView').style.display = 'none';
            document.getElementById('mobileVaultView').style.display = 'flex';
            document.getElementById('vaultLockedState').style.display = 'flex';
            document.getElementById('vaultRevealedState').style.display = 'none';
            stopCamera();
        }

        function revealPrizeVaultLocal() {
            document.getElementById('mainAppView').style.display = 'none';
            document.getElementById('mobileVaultView').style.display = 'flex';
            document.getElementById('vaultLockedState').style.display = 'none';
            document.getElementById('vaultRevealedState').style.display = 'flex';
            
            const list = document.getElementById('mobileWinnerList');
            list.innerHTML = '';
            const winners = students.filter(s => parseInt(s.Points) >= 15);
            
            if(winners.length === 0) list.innerHTML = '<p style="color: #aaa; margin-top: 20px;">No winners yet.</p>';
            winners.forEach(w => {
                const safeName = w.Name ? encodeURIComponent(w.Name.trim()) : 'Student';
                const avatar = w.AvatarURL && w.AvatarURL.trim() !== "" ? w.AvatarURL : `https://api.dicebear.com/7.x/initials/svg?seed=${safeName}&backgroundColor=FFD166,06D6A0,FF4B72,2196F3`;
                list.innerHTML += `<div class="vault-winner-card"><img src="${avatar}"> <div style="text-align: left;">${w.Name}<br><span style="color: #FF4B72;">⭐ ${w.Points}</span></div></div>`;
            });
        }

        function closePrizeVaultLocal() {
            document.getElementById('mobileVaultView').style.display = 'none';
            document.getElementById('mainAppView').style.display = 'block';
            startCamera();
        }

        function startCamera() {
            if (html5QrcodeScanner) return; 
            document.getElementById('scannerView').style.display = 'block';
            
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render((decodedText) => {
                const scannedName = decodedText.trim();
                const student = students.find(s => s.Name.toLowerCase() === scannedName.toLowerCase());
                
                if (student) {
                    activeStudentName = student.Name;
                    sendRealtimeCommand('setActive', { name: student.Name }); 
                    showActionPanel(student);
                }
            }, () => {});
        }

        function stopCamera() { if (html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; } document.getElementById('scannerView').style.display = 'none'; }

        function showActionPanel(student) {
            stopCamera(); 
            document.getElementById('actionPanel').style.display = 'block';
            
            const safeName = student.Name ? encodeURIComponent(student.Name.trim()) : 'Student';
            document.getElementById('scanAvatar').src = student.AvatarURL && student.AvatarURL.trim() !== "" ? student.AvatarURL : `https://api.dicebear.com/7.x/initials/svg?seed=${safeName}&backgroundColor=FFD166,06D6A0,FF4B72,2196F3`;
            
            document.getElementById('scanName').textContent = student.Name;
            
            // Populate the new current points display
            document.getElementById('scanPoints').textContent = `⭐ ${student.Points}`;
            
            document.getElementById('customAmount').value = '';
            document.getElementById('saveMessage').style.display = 'none';
        }

        function submitCustomPoints() {
            const amount = parseInt(document.getElementById('customAmount').value);
            if (!isNaN(amount) && amount !== 0) submitPoints(amount);
        }

        function submitPoints(amount) {
            const msgBox = document.getElementById('saveMessage');
            msgBox.className = 'msg-success'; msgBox.textContent = `✅ Sent ${amount > 0 ? '+' : ''}${amount}!`;
            msgBox.style.display = 'block';
            
            // Instantly update the points on the phone screen too so it feels responsive!
            const currentPointsSpan = document.getElementById('scanPoints');
            const currentVal = parseInt(currentPointsSpan.textContent.replace('⭐ ', ''));
            currentPointsSpan.textContent = `⭐ ${currentVal + amount}`;
            
            pubnub.publish({ channel: "classroom_channel", message: { action: "addPoints", name: activeStudentName, points: amount } });
            fetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(activeStudentName)}&points=${amount}&t=${new Date().getTime()}`, { mode: 'no-cors' });
            
            setTimeout(resetRemote, 1000); 
        }

        function resetRemote() {
            document.getElementById('actionPanel').style.display = 'none';
            activeStudentName = 'none';
            sendRealtimeCommand('setActive', { name: 'none' }); 
            startCamera(); 
        }

        function toggleAutoMode() {
            isAutoMode = isAutoMode === 'off' ? 'on' : 'off';
            sendRealtimeCommand('toggleAuto', { state: isAutoMode });
            fetch(`${GOOGLE_WEB_APP_URL}?action=toggleAuto&state=${isAutoMode}&t=${new Date().getTime()}`, { mode: 'no-cors' }); 
            
            const btn = document.getElementById('autoToggleBtn'); const txt = document.getElementById('autoToggleText');
            if (isAutoMode === 'on') { btn.className = 'auto-toggle auto-on'; txt.innerHTML = '⏹️ TURN OFF Auto-Check-In'; document.getElementById('kioskStatusMsg').innerHTML = '<span style="color: #06D6A0;">🟢 Kiosk handling scans automatically.</span>'; } 
            else { btn.className = 'auto-toggle'; txt.innerHTML = '▶️ Turn ON Auto-Check-In'; document.getElementById('kioskStatusMsg').innerHTML = '...or waiting for laptop kiosk scan...'; }
        }

        function sendRealtimeCommand(action, extras = {}) {
            pubnub.publish({ channel: "classroom_channel", message: { action: action, ...extras } });
        }

        async function loadData() {
            const res = await fetch(GOOGLE_WEB_APP_URL + '?action=get&t=' + new Date().getTime());
            const data = await res.json();
            students = data.students;
        }

        loadData(); startCamera();
    </script>
</body>
</html>
