<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Remote Control</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    
    <style>
        :root { 
            --dark: #1A1A24; 
            --surface: #FFFFFF; 
            --yellow: #FFD166; 
            --primary: #FF4B72; 
            --green: #06D6A0; 
            --bg: #f4f4f0; 
        }
        
        body { 
            margin: 0; 
            font-family: 'Nunito', sans-serif; 
            background: var(--bg); 
            color: var(--dark); 
            text-align: center; 
            background-image: radial-gradient(#d1d1d1 2.5px, transparent 2.5px); 
            background-size: 25px 25px;
            padding-bottom: 40px;
        }
        
        .fredoka { font-family: 'Fredoka', sans-serif; }
        
        header { 
            background: var(--primary); 
            color: white; 
            padding: 15px; 
            font-size: 1.5rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid var(--dark);
        }
        
        #mainAppView { display: block; }
        #mobileVaultView { display: none; flex-direction: column; height: 100vh; overflow: hidden; }

        .remote-bar { 
            padding: 10px 15px; 
            display: flex; 
            gap: 8px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        .btn-remote { 
            border: 3px solid var(--dark); 
            padding: 10px; 
            font-size: 0.95rem; 
            font-family: 'Nunito', sans-serif; 
            font-weight: 800; 
            border-radius: 8px; 
            cursor: pointer; 
            flex: 1; 
            min-width: 75px; 
            box-shadow: 3px 3px 0 var(--dark); 
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-remote:active { 
            transform: translate(2px, 2px); 
            box-shadow: 1px 1px 0 var(--dark); 
        }
        
        .btn-vault { background: var(--yellow); color: var(--dark); } 
        .btn-reveal { background: var(--green); color: white; } 
        .btn-fun { background: #9C27B0; color: white; }
        .btn-admin { background: var(--surface); color: var(--dark); } 
        .btn-goal { background: #2196F3; color: white; }
        
        /* SECTION CARDS */
        .section-card {
            background: white;
            margin: 10px 15px;
            padding: 12px;
            border-radius: 10px;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0 var(--dark);
            text-align: left;
        }
        .section-title {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* SOUNDBOARD & TIMERS */
        .grid-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-mini {
            background: var(--bg);
            border: 2px solid var(--dark);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--dark);
            flex: 1;
            min-width: 65px;
            text-align: center;
        }
        .btn-mini:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--dark); }

        /* SEARCH BAR */
        .search-container { margin: 10px 15px; }
        .remote-search {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 800;
            border: 3px solid var(--dark);
            border-radius: 10px;
            box-shadow: 4px 4px 0 var(--dark);
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }

        /* VISUAL ROSTER GRID */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding: 5px;
        }
        .student-card {
            background: white;
            border: 3px solid var(--dark);
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
            box-shadow: 3px 3px 0 var(--dark);
            cursor: pointer;
            position: relative;
            user-select: none;
        }
        .student-card.selected {
            background: var(--yellow);
            border-color: var(--primary);
            box-shadow: 3px 3px 0 var(--primary);
        }
        .student-card img {
            width: 45px;
            height: 45px;
            border-radius: 5px;
            border: 2px solid var(--dark);
            background: white;
        }
        .student-card h4 {
            margin: 5px 0 0 0;
            font-size: 0.95rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .student-card span {
            font-size: 0.85rem;
            font-weight: 800;
            color: #555;
        }

        /* MULTI-SELECT BAR */
        #bulkActionBar {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: var(--dark);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            border: 3px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 9500;
            justify-content: space-between;
            align-items: center;
        }

        .auto-toggle { 
            margin: 0 15px 10px 15px; padding: 12px; background: white; border-radius: 10px; border: 3px solid var(--dark); box-shadow: 3px 3px 0 var(--dark); cursor: pointer; 
        }
        .auto-toggle h2 { margin: 0; font-size: 1.3rem; }
        .auto-on { background: var(--green); color: white; }
        .double-on { background: var(--primary); color: white; }

        #actionPanel { 
            display: none; background: white; margin: 15px; padding: 20px; border-radius: 10px; position: relative; border: 4px solid var(--dark); box-shadow: 8px 8px 0 var(--dark);
        }
        #scanAvatar { width: 90px; height: 90px; border-radius: 10px; border: 4px solid var(--dark); background: white; box-shadow: 4px 4px 0 var(--dark); }
        .color-picker { position: absolute; top: 15px; right: 15px; width: 35px; height: 35px; padding: 0; border: 3px solid var(--dark); border-radius: 8px; cursor: pointer; box-shadow: 2px 2px 0 var(--dark); }
        
        .tag-row { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap;}
        .tag-btn { background: white; border: 2px solid var(--dark); padding: 6px 10px; border-radius: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; color: var(--dark); box-shadow: 2px 2px 0 var(--dark); }
        .tag-btn.active { background: var(--green); color: white; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn { border: 3px solid var(--dark); padding: 12px 18px; font-size: 1.6rem; font-family: 'Fredoka', sans-serif; font-weight: 800; border-radius: 10px; cursor: pointer; color: white; flex: 1; box-shadow: 4px 4px 0 var(--dark); }
        .btn-1 { background: #4CAF50; } .btn-2 { background: #2196F3; }

        #undoToast { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 12px 25px; border-radius: 10px; font-size: 1.1rem; font-weight: 800; box-shadow: 8px 8px 0 rgba(0,0,0,0.3); display: none; z-index: 9900; cursor: pointer; border: 3px solid var(--primary);
        }
        
        .btn-cancel { background: transparent; color: var(--dark); border: 3px solid var(--dark); padding: 10px; border-radius: 8px; font-size: 1.1rem; margin-top: 15px; width: 100%; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800; box-shadow: 3px 3px 0 var(--dark); }
        
        .vault-list-container { flex: 1; overflow-y: auto; background: white; border-radius: 10px; border: 4px solid var(--dark); padding: 12px; display: flex; flex-direction: column; gap: 8px; margin: 15px; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1); }
        .vault-winner-card { background: var(--bg); color: var(--dark); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.2rem; border: 3px solid var(--dark); box-shadow: 2px 2px 0 var(--dark); cursor: pointer; }
        .vault-winner-card img { width: 45px; height: 45px; border-radius: 5px; border: 2px solid var(--dark); background: white; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26, 26, 36, 0.9); display: none; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface); padding: 25px; border-radius: 10px; max-width: 350px; width: 90%; text-align: center; position: relative; border: 5px solid var(--dark); box-shadow: 8px 8px 0 var(--dark); }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 2rem; font-weight: 800; cursor: pointer; color: var(--dark); }
        .settings-input { width: 100%; padding: 10px; font-size: 1.1rem; border-radius: 8px; border: 3px solid var(--dark); margin-bottom: 12px; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 800; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1); }
        .settings-label { text-align: left; display: block; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
    </style>
</head>
<body>

    <audio id="dingSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div id="mainAppView">
        <header class="fredoka">
            📱 Teacher Dashboard 
            <button class="btn-remote btn-fun" style="max-width: 45px; border-color: white; box-shadow: none;" onclick="sendRealtimeCommand('partyConfetti')">🎉</button>
        </header>
        
        <div class="remote-bar">
            <button id="btnPauseScrollRemote" class="btn-remote" style="background:#ddd; color:var(--dark);" onclick="toggleScrollRemote()">⏸️ Pause</button>
            <button class="btn-remote btn-vault" onclick="sendRealtimeCommand('showVault'); openPrizeVaultLocal();">🎁 Vault</button>
            <button class="btn-remote btn-reveal" onclick="sendRealtimeCommand('revealVault'); revealPrizeVaultLocal();">🏆 Reveal</button>
            <button class="btn-remote btn-goal" onclick="openPinModal('goal')">🎯 Goal</button>
            <button class="btn-remote btn-admin" onclick="openPinModal('database')">⚙️ Admin</button>
            <button id="doubleBtn" class="btn-remote" style="background:var(--dark); color:white; min-width: 100%; margin-top: 3px;" onclick="toggleDouble()">🔥 Enable x2 Points</button>
        </div>

        <!-- WHOLE CLASS & MULTI-SELECT ACTIONS -->
        <div class="remote-bar" style="padding-top: 0;">
            <button class="btn-remote" style="background: var(--green); color: white;" onclick="awardClassPoint()">👥 Class +1</button>
            <button id="btnMultiSelect" class="btn-remote" style="background: var(--surface);" onclick="toggleMultiSelectMode()">☑️ Multi-Select</button>
        </div>

        <div id="autoToggleBtn" class="auto-toggle" onclick="toggleAutoMode()">
            <h2 id="autoToggleText" class="fredoka">▶️ Turn ON Auto-Check-In</h2>
        </div>

        <!-- SOUNDBOARD SFX -->
        <div class="section-card">
            <div class="section-title"><span>🔊 Soundboard SFX</span></div>
            <div class="grid-buttons">
                <button class="btn-mini" onclick="sendRealtimeCommand('playSFX', {sfx: 'airhorn'})">🎺 Airhorn</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('playSFX', {sfx: 'drumroll'})">🥁 Drumroll</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('playSFX', {sfx: 'crickets'})">🦗 Crickets</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('playSFX', {sfx: 'tada'})">🎉 Ta-da</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('playSFX', {sfx: 'chime'})">🔔 Chime</button>
            </div>
        </div>

        <!-- TIMER CONTROLS -->
        <div class="section-card">
            <div class="section-title"><span>⏱️ Countdown Timer</span></div>
            <div class="grid-buttons">
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 60})">1 Min</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 120})">2 Min</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 300})">5 Min</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 600})">10 Min</button>
                <button class="btn-mini" style="background: #ffcccc;" onclick="sendRealtimeCommand('stopTimer')">⏹️ Clear</button>
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container">
            <input type="text" id="remoteSearchInput" class="remote-search" list="studentDatalist" placeholder="🔍 Search or tap student below..." onchange="handleRemoteSearch(this.value)">
            <datalist id="studentDatalist"></datalist>
        </div>

        <!-- VISUAL ROSTER GRID -->
        <div class="section-card" style="padding: 10px;">
            <div class="section-title"><span id="rosterHeaderTitle">📋 Student Roster</span></div>
            <div class="roster-grid" id="rosterGrid"></div>
        </div>

        <!-- SINGLE STUDENT ACTION PANEL -->
        <div id="actionPanel">
            <input type="color" id="avatarColor" class="color-picker" title="Change Avatar Color" onchange="updateAvatarColor(this.value)">
            <img id="scanAvatar" src="" alt="Student Avatar">
            <h2 id="scanName" class="fredoka" style="font-size: 2.2rem; margin: 10px 0 0 0; color: var(--dark);">Name</h2>
            <div style="font-size: 1.5rem; font-weight: 800; color: var(--dark);">⭐ <span id="scanPoints" class="fredoka">0</span></div>
            
            <div class="tag-row">
                <button class="tag-btn" onclick="toggleTag(this, 'Helping')">Helping</button>
                <button class="tag-btn" onclick="toggleTag(this, 'On Task')">On Task</button>
                <button class="tag-btn" onclick="toggleTag(this, 'Quiet')">Quiet</button>
            </div>

            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <button class="btn-cancel" style="margin-top: 0; background: #eee; color: var(--dark);" onclick="document.getElementById('artUpload').click()">📸 Add Art</button>
                <button class="btn-cancel" style="margin-top: 0; background: #eee; color: var(--dark);" onclick="document.getElementById('avatarUpload').click()">📸 Avatar</button>
            </div>
            <input type="file" id="artUpload" accept="image/*" style="display:none" onchange="handleImageUpload(this, 'artwork')">
            <input type="file" id="avatarUpload" accept="image/*" capture="user" style="display:none" onchange="handleImageUpload(this, 'avatar')">

            <div class="btn-group">
                <button class="btn btn-1" onclick="submitPoints(1)">+1</button>
                <button class="btn btn-2" onclick="submitPoints(2)">+2</button>
            </div>

            <button class="btn-cancel" onclick="resetRemote()">Cancel / Back to Roster</button>
        </div>
    </div>

    <!-- BULK ACTION BAR -->
    <div id="bulkActionBar">
        <span id="bulkCountText" style="font-weight: 800;">0 Selected</span>
        <div>
            <button class="btn-mini" style="background: var(--green); color: white;" onclick="submitBulkPoints(1)">+1 All</button>
            <button class="btn-mini" style="background: #2196F3; color: white;" onclick="submitBulkPoints(2)">+2 All</button>
            <button class="btn-mini" style="background: #ffcccc;" onclick="clearMultiSelect()">Clear</button>
        </div>
    </div>

    <div id="undoToast" onclick="undoLastPoint()">↩️ Undo Last Point</div>

    <!-- VAULT VIEW -->
    <div id="mobileVaultView">
        <header style="background: var(--yellow); color: var(--dark);" class="fredoka">🎁 Prize Vault Control</header>
        <div id="vaultLockedState" style="flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
            <h1 style="font-size: 5rem; margin:0;">🔒</h1>
            <button class="btn-remote btn-reveal" style="padding: 20px; font-size: 2rem; width: 100%; margin-top: 20px;" onclick="sendRealtimeCommand('revealVault'); revealPrizeVaultLocal();">🎉 Reveal Winners</button>
        </div>
        <div id="vaultRevealedState" style="display: none; flex-direction: column; padding: 10px; flex: 1; min-height: 0;">
            <h2 style="color: var(--dark); margin-top: 10px; font-size: 2rem; background: white; padding: 10px; border: 3px solid var(--dark); border-radius: 10px; box-shadow: 4px 4px 0 var(--dark);" class="fredoka">🏆 15-Point Club</h2>
            <div id="mobileWinnerList" class="vault-list-container" onscroll="syncVaultScroll(event)"></div>
        </div>
        <div style="padding: 20px;"><button class="btn-cancel" style="width: 100%; background: var(--dark); color: white; border-color: var(--dark); margin: 0;" onclick="sendRealtimeCommand('closeVault'); closePrizeVaultLocal();">✖ Close Vault Everywhere</button></div>
    </div>

    <!-- MODALS -->
    <div id="pinModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closePinModal()">&times;</span>
            <h2 style="margin-top: 0; color: var(--dark);" class="fredoka">Admin Access</h2>
            <input type="password" id="pinInput" class="settings-input" style="text-align: center; letter-spacing: 10px; font-size: 2rem;" placeholder="****" maxlength="4">
            <button type="button" onclick="verifyPin()" class="btn-remote" style="background: var(--green); color: white; width: 100%; font-size: 1.5rem; padding: 15px;">Unlock</button>
        </div>
    </div>

    <div id="goalModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('goalModal').classList.remove('active')">&times;</span>
            <h2 style="margin-top: 0; color: var(--dark);" class="fredoka">🎯 Edit Class Goal</h2>
            <label class="settings-label">Goal Emoji:</label>
            <input type="text" id="goalEmojiInput" class="settings-input" value="🍕">
            <label class="settings-label">Goal Name:</label>
            <input type="text" id="goalNameInput" class="settings-input" value="Pizza Party">
            <label class="settings-label">Target Amount:</label>
            <input type="number" id="goalAmountInput" class="settings-input" value="500">
            <button type="button" class="btn-remote btn-prize" style="width: 100%; font-size: 1.5rem; margin-top: 10px; padding: 15px;" onclick="saveGoalSettings()">Broadcast Goal</button>
        </div>
    </div>

    <script>
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlTv6HfOVB_AFua7XKePmCySDo5VsJeRpdF4jTgjt3nSm9v3Iz1pTdhO1GwkELAKNdhQ/exec";
        const PUBNUB_PUBLISH_KEY = "pub-c-88fdc434-b3b5-4eae-963f-2ad1eac8d271";
        const PUBNUB_SUBSCRIBE_KEY = "sub-c-dfcda561-cd3f-48c6-8fba-e3ff29235b19";
        const IMGBB_API_KEY = "5933faef3eb0327b5c5e1d69b7aae0c4";

        const ADMIN_SHEET_URL = "https://docs.google.com/spreadsheets/d/1_mwGR_ljLD3drdZ7F28jMZRLfia1Vg56Icvgtk2-N9Y/edit";
        const ADMIN_PIN = "2009";

        const pubnub = new PubNub({ 
            publishKey: PUBNUB_PUBLISH_KEY, 
            subscribeKey: PUBNUB_SUBSCRIBE_KEY, 
            userId: "teacher_phone" 
        });
        
        pubnub.subscribe({ channels: ["classroom_channel"] });

        let students = []; 
        let activeStudentName = 'none'; 
        let isAutoMode = 'off'; 
        let isDouble = false; 
        let isMultiSelectMode = false;
        let selectedStudentsSet = new Set();
        let scrollTimeout = null;
        let selectedTag = "None"; 
        let undoData = null; 
        let undoTimer = null;
        let isScrollPaused = false;

        function showToast(msg, isSuccess = false) {
            const toast = document.getElementById('undoToast');
            if (!toast) return;
            toast.style.background = isSuccess ? 'var(--green)' : 'var(--primary)';
            toast.style.color = 'white';
            toast.innerHTML = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function getSafeAvatar(studentName, url) {
            const safeName = studentName ? encodeURIComponent(studentName.trim()) : 'Student';
            const strUrl = url ? url.toString().trim() : "";
            if (!strUrl || !strUrl.startsWith("http") || strUrl.includes("github.io")) {
                return `https://api.dicebear.com/9.x/bottts/svg?seed=${safeName}`;
            }
            return strUrl;
        }

        let offlineQueue = JSON.parse(localStorage.getItem('classroomQueue') || '[]');
        
        function robustFetch(url) {
            fetch(url, { mode: 'no-cors' }).catch(err => {
                offlineQueue.push(url); 
                localStorage.setItem('classroomQueue', JSON.stringify(offlineQueue));
            });
        }
        
        setInterval(() => {
            if (navigator.onLine && offlineQueue.length > 0) {
                const url = offlineQueue.shift();
                fetch(url, { mode: 'no-cors' })
                    .then(() => localStorage.setItem('classroomQueue', JSON.stringify(offlineQueue)))
                    .catch(e => offlineQueue.unshift(url));
            }
        }, 5000);

        pubnub.addListener({
            message: function(event) {
                try {
                    if (!event.message || !event.message.action) return;

                    if (event.message.action === "setActive" && isAutoMode === 'off') {
                        activeStudentName = event.message.name;
                        const student = students.find(s => s.Name.toLowerCase() === activeStudentName.toLowerCase());
                        if (student) showActionPanel(student, true); 
                    }
                    else if (event.message.action === "showVault" || event.message.action === "triggerVault") {
                        openPrizeVaultLocal();
                    }
                    else if (event.message.action === "revealVault") {
                        revealPrizeVaultLocal();
                    }
                    else if (event.message.action === "closeVault") {
                        closePrizeVaultLocal();
                    }
                    else if (event.message.action === "addPoints") {
                        const student = students.find(s => s.Name.toLowerCase() === event.message.name.toLowerCase());
                        if (student) {
                            student.Points = parseInt(student.Points) + event.message.points;
                            renderRosterGrid();
                            if (event.message.points < 0 && document.getElementById('vaultRevealedState').style.display === 'flex') {
                                revealPrizeVaultLocal();
                            }
                        }
                    }
                    else if (event.message.action === "toggleScroll") {
                        isScrollPaused = event.message.paused;
                        document.getElementById('btnPauseScrollRemote').innerHTML = isScrollPaused ? '▶️ Play' : '⏸️ Pause';
                    }
                } catch(err) {
                    console.error("Error in remote message listener:", err);
                }
            }
        });

        function sendRealtimeCommand(action, extras = {}) { 
            pubnub.publish(
                { channel: "classroom_channel", message: { action: action, ...extras } },
                function(status) {
                    if (status && status.error) {
                        showToast("⚠️ Signal lost. Reconnecting...");
                    }
                }
            ); 
        }

        // RENDER VISUAL STUDENT ROSTER
        function renderRosterGrid() {
            const grid = document.getElementById('rosterGrid');
            if (!grid) return;
            grid.innerHTML = '';

            students.forEach(s => {
                const isSelected = selectedStudentsSet.has(s.Name);
                const card = document.createElement('div');
                card.className = `student-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => handleStudentCardClick(s);

                card.innerHTML = `
                    <img src="${getSafeAvatar(s.Name, s.AvatarURL)}" alt="Avatar">
                    <h4 class="fredoka">${s.Name}</h4>
                    <span>⭐ ${s.Points}</span>
                `;
                grid.appendChild(card);
            });
        }

        function handleStudentCardClick(student) {
            if (isMultiSelectMode) {
                if (selectedStudentsSet.has(student.Name)) {
                    selectedStudentsSet.delete(student.Name);
                } else {
                    selectedStudentsSet.add(student.Name);
                }
                updateBulkBarUI();
                renderRosterGrid();
            } else {
                activeStudentName = student.Name;
                sendRealtimeCommand('setActive', { name: student.Name });
                showActionPanel(student, false);
            }
        }

        // MULTI-SELECT & WHOLE CLASS LOGIC
        function toggleMultiSelectMode() {
            isMultiSelectMode = !isMultiSelectMode;
            const btn = document.getElementById('btnMultiSelect');
            const title = document.getElementById('rosterHeaderTitle');
            
            if (isMultiSelectMode) {
                btn.style.background = 'var(--yellow)';
                title.textContent = "☑️ Select Students below...";
                document.getElementById('bulkActionBar').style.display = 'flex';
            } else {
                clearMultiSelect();
            }
        }

        function clearMultiSelect() {
            isMultiSelectMode = false;
            selectedStudentsSet.clear();
            document.getElementById('btnMultiSelect').style.background = 'var(--surface)';
            document.getElementById('rosterHeaderTitle').textContent = "📋 Student Roster";
            document.getElementById('bulkActionBar').style.display = 'none';
            renderRosterGrid();
        }

        function updateBulkBarUI() {
            document.getElementById('bulkCountText').textContent = `${selectedStudentsSet.size} Selected`;
        }

        function awardClassPoint() {
            if (confirm("Award +1 Point to the ENTIRE class?")) {
                const allNames = students.map(s => s.Name);
                const finalPts = isDouble ? 2 : 1;
                
                sendRealtimeCommand('bulkAddPoints', { students: allNames, points: finalPts });
                
                allNames.forEach(name => {
                    robustFetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(name)}&points=${finalPts}&tag=Class+Reward&t=${new Date().getTime()}`);
                });
                
                showToast(`🎉 Whole Class got +${finalPts}!`, true);
                loadData();
            }
        }

        function submitBulkPoints(amount) {
            if (selectedStudentsSet.size === 0) {
                alert("Please select at least one student first!");
                return;
            }
            const finalPts = isDouble ? amount * 2 : amount;
            const namesArray = Array.from(selectedStudentsSet);

            sendRealtimeCommand('bulkAddPoints', { students: namesArray, points: finalPts });

            namesArray.forEach(name => {
                robustFetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(name)}&points=${finalPts}&tag=Group+Reward&t=${new Date().getTime()}`);
            });

            showToast(`⭐ +${finalPts} awarded to ${namesArray.length} students!`, true);
            clearMultiSelect();
            loadData();
        }

        function redeemPrize(name) {
            if(confirm(`Redeem prize for ${name}? This will deduct 15 points.`)) {
                sendRealtimeCommand('addPoints', { name: name, points: -15, isDouble: false });
                robustFetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(name)}&points=-15&tag=Prize+Redeemed&t=${new Date().getTime()}`);
            }
        }

        function toggleScrollRemote() {
            isScrollPaused = !isScrollPaused;
            document.getElementById('btnPauseScrollRemote').innerHTML = isScrollPaused ? '▶️ Play' : '⏸️ Pause';
            sendRealtimeCommand('toggleScroll', { paused: isScrollPaused });
        }

        function populateDatalist() {
            const datalist = document.getElementById('studentDatalist');
            if (!datalist) return;
            datalist.innerHTML = '';
            students.forEach(s => {
                const option = document.createElement('option');
                option.value = s.Name;
                datalist.appendChild(option);
            });
        }

        function handleRemoteSearch(val) {
            if (!val || !val.trim()) return;
            const searchVal = val.trim().toLowerCase();
            const student = students.find(s => s.Name.trim().toLowerCase() === searchVal);
            
            if (student) {
                document.getElementById('remoteSearchInput').value = '';
                activeStudentName = student.Name; 
                sendRealtimeCommand('setActive', { name: student.Name }); 
                showActionPanel(student, false); 
            } else {
                showToast("⚠️ Student not found.");
            }
        }

        function syncVaultScroll(e) { 
            if (scrollTimeout) return; 
            scrollTimeout = setTimeout(() => { 
                const maxScroll = e.target.scrollHeight - e.target.clientHeight || 1; 
                sendRealtimeCommand('scrollVault', { percent: e.target.scrollTop / maxScroll }); 
                scrollTimeout = null; 
            }, 100); 
        }

        function openPrizeVaultLocal() { 
            document.getElementById('mainAppView').style.display = 'none'; 
            document.getElementById('mobileVaultView').style.display = 'flex'; 
            document.getElementById('vaultLockedState').style.display = 'flex'; 
            document.getElementById('vaultRevealedState').style.display = 'none'; 
        }
        
        function closePrizeVaultLocal() { 
            document.getElementById('mobileVaultView').style.display = 'none'; 
            document.getElementById('mainAppView').style.display = 'block'; 
        }
        
        function revealPrizeVaultLocal() {
            document.getElementById('mainAppView').style.display = 'none'; 
            document.getElementById('mobileVaultView').style.display = 'flex'; 
            document.getElementById('vaultLockedState').style.display = 'none'; 
            document.getElementById('vaultRevealedState').style.display = 'flex';
            
            const list = document.getElementById('mobileWinnerList'); 
            list.innerHTML = '';
            
            const winners = students.filter(s => parseInt(s.Points) >= 15);
            if (winners.length === 0) {
                list.innerHTML = '<p style="color: var(--dark);">No winners yet.</p>';
            }
            
            winners.forEach(w => { 
                const avatar = getSafeAvatar(w.Name, w.AvatarURL);
                const card = document.createElement('div');
                card.className = 'vault-winner-card';
                card.onclick = function() { redeemPrize(w.Name); };
                
                card.innerHTML = `
                    <img src="${avatar}" alt="Winner Avatar"> 
                    <div style="text-align: left;" class="fredoka">
                        ${w.Name}<br>
                        <span style="color: #FF4B72;">⭐ ${w.Points}</span>
                    </div>
                `; 
                list.appendChild(card);
            });
        }

        let pinTarget = '';
        function openPinModal(target) {
            pinTarget = target; 
            document.getElementById('pinInput').value = ''; 
            document.getElementById('pinModal').classList.add('active'); 
            document.getElementById('pinInput').focus(); 
        }
        function closePinModal() { 
            document.getElementById('pinModal').classList.remove('active'); 
        }
        function verifyPin() { 
            if (document.getElementById('pinInput').value === ADMIN_PIN) { 
                closePinModal(); 
                if (pinTarget === 'database') {
                    window.open(ADMIN_SHEET_URL, '_blank'); 
                } else if (pinTarget === 'goal') {
                    document.getElementById('goalEmojiInput').value = localStorage.getItem('customGoalEmoji') || '🍕';
                    document.getElementById('goalNameInput').value = localStorage.getItem('customGoalName') || 'Pizza Party';
                    document.getElementById('goalAmountInput').value = localStorage.getItem('customGoalAmount') || 500;
                    document.getElementById('goalModal').classList.add('active');
                }
            } else { 
                alert("❌ Incorrect PIN!"); 
                document.getElementById('pinInput').value = ''; 
            } 
        }
        document.getElementById('pinInput').addEventListener('keyup', (e) => { 
            if (e.key === 'Enter') verifyPin(); 
        });

        function saveGoalSettings() {
            const emoji = document.getElementById('goalEmojiInput').value || '🍕';
            const name = document.getElementById('goalNameInput').value || 'Pizza Party';
            const amount = document.getElementById('goalAmountInput').value || 500;
            
            sendRealtimeCommand('updateGoal', { emoji: emoji, name: name, amount: amount });
            document.getElementById('goalModal').classList.remove('active');
            alert("✅ Goal settings beamed to Big Screen!");
        }

        function showActionPanel(student, isKioskScan) {
            if (isKioskScan) {
                if (navigator.vibrate) navigator.vibrate([200]);
                document.getElementById('dingSound').play().catch(e => {}); 
            }
            document.getElementById('actionPanel').style.display = 'block';
            
            document.getElementById('scanAvatar').src = getSafeAvatar(student.Name, student.AvatarURL);
            document.getElementById('scanName').textContent = student.Name;
            document.getElementById('scanPoints').textContent = student.Points;
            
            document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
            selectedTag = "None";
        }

        function toggleDouble() {
            isDouble = !isDouble;
            const btn = document.getElementById('doubleBtn');
            btn.className = isDouble ? 'btn-remote double-on' : 'btn-remote';
            btn.style.background = isDouble ? 'var(--primary)' : 'var(--dark)';
            btn.innerHTML = isDouble ? '🔥 Disable x2 Points' : '🔥 Enable x2 Points';
            sendRealtimeCommand('toggleDouble', { state: isDouble });
        }

        function toggleTag(btn, tag) {
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            if (selectedTag === tag) { 
                selectedTag = "None"; 
            } else { 
                btn.classList.add('active'); 
                selectedTag = tag; 
            }
        }

        function updateAvatarColor(hexColor) {
            const hex = hexColor.replace('#', '');
            const safeName = activeStudentName ? encodeURIComponent(activeStudentName.trim()) : 'Student';
            const newUrl = `https://api.dicebear.com/9.x/bottts/svg?seed=${safeName}&backgroundColor=${hex}`;
            document.getElementById('scanAvatar').src = newUrl;
            
            robustFetch(`${GOOGLE_WEB_APP_URL}?action=updateAvatar&name=${encodeURIComponent(activeStudentName)}&url=${encodeURIComponent(newUrl)}&t=${new Date().getTime()}`);
            sendRealtimeCommand('refreshData'); 
        }

        function submitPoints(amount) {
            const finalAmount = isDouble ? amount * 2 : amount;
            
            undoData = { name: activeStudentName, points: finalAmount, tag: selectedTag };
            showToast(`⭐ +${finalAmount} to ${activeStudentName}`, true);
            
            clearTimeout(undoTimer); 
            undoTimer = setTimeout(() => { 
                const toast = document.getElementById('undoToast');
                if (toast) toast.style.display = 'none'; 
                undoData = null; 
            }, 5000);
            
            sendRealtimeCommand('addPoints', { name: activeStudentName, points: finalAmount, isDouble: isDouble });
            robustFetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(activeStudentName)}&points=${finalAmount}&tag=${encodeURIComponent(selectedTag)}&t=${new Date().getTime()}`);
            
            resetRemote(); 
            loadData();
        }

        function undoLastPoint() {
            if (!undoData) return;
            sendRealtimeCommand('addPoints', { name: undoData.name, points: -undoData.points, isDouble: false });
            robustFetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(undoData.name)}&points=${-undoData.points}&tag=UNDO&t=${new Date().getTime()}`);
            
            const toast = document.getElementById('undoToast');
            if (toast) toast.style.display = 'none'; 
            undoData = null;
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]); 
            loadData();
        }

        function resetRemote() {
            document.getElementById('actionPanel').style.display = 'none';
            activeStudentName = 'none'; 
            sendRealtimeCommand('setActive', { name: 'none' }); 
        }

        function toggleAutoMode() {
            isAutoMode = isAutoMode === 'off' ? 'on' : 'off';
            sendRealtimeCommand('toggleAuto', { state: isAutoMode });
            robustFetch(`${GOOGLE_WEB_APP_URL}?action=toggleAuto&state=${isAutoMode}&t=${new Date().getTime()}`); 
            
            const btn = document.getElementById('autoToggleBtn'); 
            const txt = document.getElementById('autoToggleText');
            if (isAutoMode === 'on') { 
                btn.className = 'auto-toggle auto-on'; 
                txt.innerHTML = '⏹️ TURN OFF Auto-Check-In'; 
            } else { 
                btn.className = 'auto-toggle'; 
                txt.innerHTML = '▶️ Turn ON Auto-Check-In'; 
            }
        }

        async function loadData() {
            try {
                const res = await fetch(GOOGLE_WEB_APP_URL + '?action=get&t=' + new Date().getTime());
                const data = await res.json(); 
                students = data.students || [];
                populateDatalist();
                renderRosterGrid();
            } catch(err) {
                console.error("Remote failed to load student data.");
            }
        }
        
        loadData(); 

        async function handleImageUpload(input, type) {
            const file = input.files[0];
            if (!file) return;

            showToast(`⏳ Uploading ${type}...`);

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    const imageUrl = data.data.url; 
                    
                    const actionStr = type === 'artwork' ? 'updateArtwork' : 'updateAvatar';
                    robustFetch(`${GOOGLE_WEB_APP_URL}?action=${actionStr}&name=${encodeURIComponent(activeStudentName)}&url=${encodeURIComponent(imageUrl)}&t=${new Date().getTime()}`);
                    
                    showToast(`✅ ${type} saved!`, true);
                    
                    if(type === 'avatar') document.getElementById('scanAvatar').src = imageUrl;

                    sendRealtimeCommand('refreshData'); 
                } else {
                    throw new Error("ImgBB rejected upload");
                }
            } catch (err) {
                showToast("❌ Upload failed.");
            }
            input.value = ""; 
        }
    </script>
</body>
</html>
