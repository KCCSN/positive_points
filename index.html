<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Digital Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

    <style>
        :root { --dark: #2B2D42; --surface: #FFFFFF; --yellow: #FFD166; --primary: #FF4B72; --green: #06D6A0;}
        body { margin: 0; font-family: 'Fredoka', sans-serif; color: var(--dark); background: #111; overflow: hidden; }

        .split-layout { display: flex; height: 100vh; width: 100vw; }
        .left-panel { flex: 1; display: flex; flex-direction: column; position: relative; background: linear-gradient(-45deg, #FF9A9E, #FECFEF, #a8edea, #00C6FF); background-size: 400% 400%; animation: gradientBG 15s ease infinite; padding: 20px; box-sizing: border-box; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 100; }
        .search-bar { width: 300px; padding: 15px 25px; font-size: 1.2rem; font-family: var(--font-family); font-weight: 600; background: var(--surface); color: var(--dark); border: 5px solid var(--dark); border-radius: 50px; box-shadow: 0 6px 0 var(--dark); outline: none; transition: all 0.2s; }
        .nav-buttons { display: flex; gap: 10px; }
        .btn-admin { background: var(--surface); color: var(--dark); border: 4px solid var(--dark); padding: 10px 20px; font-size: 1.1rem; font-family: var(--font-family); font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 var(--dark); transition: all 0.15s; }
        .btn-prize { background: var(--yellow); }

        .leaderboard-wrapper { flex: 1; overflow: hidden; position: relative; margin-bottom: 20px; mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); }
        .scroll-track { display: flex; flex-direction: column; gap: 15px; animation: scrollUp 40s linear infinite; }
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        
        .lb-card { background: var(--surface); border: 4px solid var(--dark); border-radius: 20px; padding: 15px 25px; display: flex; align-items: center; box-shadow: 0 6px 0 var(--dark); margin: 0 10px; }
        .lb-card img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--dark); margin-right: 20px; }
        .lb-card h3 { flex: 1; margin: 0; font-size: 1.8rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .lb-card p { margin: 0; font-size: 1.5rem; font-weight: 800; background: var(--yellow); padding: 5px 20px; border-radius: 30px; border: 4px solid var(--dark); }

        .kiosk-cam-container { background: var(--surface); padding: 10px; border-radius: 20px; border: 6px solid var(--dark); box-shadow: 8px 8px 0 rgba(0,0,0,0.5); width: 200px; z-index: 100; }
        #reader { border-radius: 10px; overflow: hidden; }
        .kiosk-label { text-align: center; font-weight: 800; font-size: 1rem; margin-top: 10px; color: var(--primary); }

        #kioskPopup { position: absolute; bottom: 30px; left: 250px; right: 20px; background: white; border: 6px solid var(--dark); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 10px 10px 0 rgba(0,0,0,0.4); display: none; z-index: 200; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .right-panel { flex: 1; background: var(--dark); padding: 30px; display: flex; align-items: center; justify-content: center; }
        .art-frame { width: 100%; height: 100%; border-radius: 30px; border: 12px solid var(--surface); background-color: #222; background-size: contain; background-repeat: no-repeat; background-position: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 20px 40px rgba(0,0,0,0.5); transition: background-image 1s ease-in-out; display: flex; align-items: center; justify-content: center; }
        .no-art-text { color: #555; font-size: 2rem; font-weight: 800; display: none; }

        #autoModeBadge { position: fixed; top: 90px; left: 40px; z-index: 110; display: none; background: var(--green); color: white; padding: 10px 20px; border-radius: 50px; font-size: 1.2rem; font-weight: 800; border: 4px solid var(--dark); box-shadow: 4px 4px 0 var(--dark); animation: pulse 2s infinite; }
        #spamWarning { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; display: none; background: #FF4B72; color: white; padding: 30px 50px; border-radius: 30px; font-size: 3rem; font-weight: 800; border: 8px solid var(--dark); box-shadow: 15px 15px 0 var(--dark); text-align: center; }

        .celebration-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; flex-direction: column;}
        .sunburst { position: absolute; width: 200vw; height: 200vw; background: repeating-conic-gradient(var(--yellow) 0 15deg, #FFB703 15deg 30deg); animation: spinBurst 10s linear infinite; z-index: -1; opacity: 0.5; }
        .celebration-box { text-align: center; color: white; z-index: 10; }
        .celebration-box img { width: 300px; height: 300px; border-radius: 50%; border: 12px solid white; margin: 20px 0; }
        .anim-pop { animation: pop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(43, 45, 66, 0.8); display: none; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(8px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface); padding: 50px 40px 40px 40px; border-radius: 40px; max-width: 450px; text-align: center; position: relative; border: 8px solid var(--dark); box-shadow: 0 15px 0 rgba(0,0,0,0.3); }
        .close-btn { position: absolute; top: 15px; right: 25px; font-size: 2.5rem; font-weight: 700; cursor: pointer; color: var(--dark); }
        
        .mystery-box { font-size: 10rem; cursor: pointer; animation: shake 2s infinite ease-in-out; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 20%, 60% { transform: rotate(-10deg); } 40%, 80% { transform: rotate(10deg); } }
        .prize-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 90vw; }
        .prize-card { background: var(--yellow); padding: 20px; border-radius: 20px; border: 4px solid var(--dark); text-align: center; width: 200px;}
        .prize-card img { width: 100px; border-radius: 50%; border: 4px solid var(--dark); }
        .bounce-in { animation: rubberBand 1.2s both; }
    </style>
</head>
<body>

    <div class="split-layout">
        <div class="left-panel">
            <div class="top-bar">
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Find a student...">
                <div class="nav-buttons">
                    <button onclick="openPrizeVault()" class="btn-admin btn-prize">🎁 Prize Vault</button>
                    <button onclick="openDatabase()" class="btn-admin">⚙️ Database</button>
                </div>
            </div>

            <div id="autoModeBadge">🟢 AUTO-SCAN ACTIVE</div>
            
            <div class="leaderboard-wrapper">
                <div class="scroll-track" id="scrollTrack"></div>
            </div>

            <div class="kiosk-cam-container">
                <div id="reader"></div>
                <div class="kiosk-label" id="kioskLabel">SCAN CARD HERE</div>
            </div>

            <div id="kioskPopup">
                <h2 style="font-size: 2.5rem; margin:0;" id="kioskPopupName">Name</h2>
                <p style="font-size: 1.5rem; color: #555; margin: 10px 0;" id="kioskPopupStatus">Waiting for teacher...</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="art-frame" id="artFrame">
                <div class="no-art-text" id="noArtText">Gathering Masterpieces...</div>
            </div>
        </div>
    </div>

    <div id="spamWarning">Nice try!<br>Already checked in. 🛑</div>
    <div id="celebrationOverlay" class="celebration-overlay">
        <div class="sunburst"></div>
        <div id="celebrationBox" class="celebration-box">
            <h1 style="font-size: 6rem; margin:0;">🎉 LEVEL UP! 🎉</h1>
            <img id="celebrationAvatar" src="">
            <h2 id="celebrationName" style="font-size: 5rem; margin:0;">Name</h2>
            <div style="font-size: 6rem; color: var(--yellow); font-weight: 800;">+<span id="celebrationPoints">5</span></div>
        </div>
    </div>
    <div id="prizeVaultOverlay" class="celebration-overlay" onclick="handleVaultClick(event)">
        <span class="close-btn" onclick="closePrizeVault()" style="color: white; right: 40px; top: 30px; font-size: 4rem; z-index: 100;">&times;</span>
        <div id="mysteryState" style="text-align: center; z-index: 10;">
            <h1 style="color: white; font-size: 6rem;">Who Unlocked a Prize?</h1>
            <div class="mystery-box" onclick="revealPrizes()">🎁</div>
        </div>
        <div id="revealedState" style="display: none; text-align: center; z-index: 10;">
            <div class="sunburst" style="opacity: 0.2;"></div>
            <h1 style="color: var(--yellow); font-size: 6rem; text-shadow: 6px 6px 0 var(--dark);">🏆 15-Point Club 🏆</h1>
            <div id="prizeGrid" class="prize-grid"></div>
            <h2 id="noPrizeMsg" style="color: white; font-size: 3rem; display: none;">Keep working hard! 🌟</h2>
        </div>
    </div>
    <div id="pinModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 350px;">
            <h2 style="margin-top: 0;">Admin Access</h2>
            <input type="password" id="pinInput" style="width: 80%; padding: 15px; font-size: 2rem; text-align: center; border: 4px solid var(--dark); border-radius: 15px; letter-spacing: 10px; margin-bottom: 20px;" placeholder="****" maxlength="4">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="closePinModal()" class="btn-admin" style="background: #eee;">Cancel</button>
                <button onclick="verifyPin()" class="btn-admin" style="background: var(--green); color: white;">Unlock</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ PASTE YOUR KEYS AND URL HERE ⚠️
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlTv6HfOVB_AFua7XKePmCySDo5VsJeRpdF4jTgjt3nSm9v3Iz1pTdhO1GwkELAKNdhQ/exec";
        const PUBNUB_PUBLISH_KEY = "pub-c-88fdc434-b3b5-4eae-963f-2ad1eac8d271";
        const PUBNUB_SUBSCRIBE_KEY = "sub-c-dfcda561-cd3f-48c6-8fba-e3ff29235b19";
        
        const ADMIN_SHEET_URL = "https://docs.google.com/spreadsheets/d/1_mwGR_ljLD3drdZ7F28jMZRLfia1Vg56Icvgtk2-N9Y/edit";
        const ADMIN_PIN = "2009";

        // Initialize PubNub
        const pubnub = new PubNub({ publishKey: PUBNUB_PUBLISH_KEY, subscribeKey: PUBNUB_SUBSCRIBE_KEY, userId: "big_screen" });
        pubnub.subscribe({ channels: ["classroom_channel"] });

        let students = []; let orderedStudents = [];
        let celebrationQueue = []; let isCelebrating = false;
        let activeKioskStudent = null; let kioskTimer = null;
        let isAutoMode = false; let scannedThisSession = new Set(); 
        let knownStudentCount = 0; let wasSearching = false;
        let artworkList = []; let artIndex = 0; let artInterval = null;

        // --- REALTIME LISTENER ---
        pubnub.addListener({
            message: function(event) {
                const msg = event.message;
                
                if (msg.action === "addPoints") {
                    const student = students.find(s => s.Name.toLowerCase() === msg.name.toLowerCase());
                    if (student) {
                        student.Points = parseInt(student.Points) + msg.points;
                        updateLeaderboardPoints(); // Instant text update
                        if (msg.points > 0) {
                            celebrationQueue.push({ student: student, pointsGained: msg.points });
                            processCelebrations(); // Instant animation!
                        }
                    }
                } 
                else if (msg.action === "setActive") {
                    if (msg.name === 'none') {
                        activeKioskStudent = null; document.getElementById('kioskPopup').style.display = 'none';
                    } else {
                        const student = students.find(s => s.Name.toLowerCase() === msg.name.toLowerCase());
                        if (student) triggerKioskPopup(student);
                    }
                }
                else if (msg.action === "showVault") openPrizeVault();
                else if (msg.action === "revealVault") revealPrizes();
                else if (msg.action === "closeVault") closePrizeVault();
                else if (msg.action === "toggleAuto") setAutoMode(msg.state);
            }
        });

        function getShuffleSeed(name) { if (!window[name]) window[name] = Math.random(); return window[name]; }
        function shuffleArray(array) { return array.sort((a, b) => getShuffleSeed(a.Name) - getShuffleSeed(b.Name)); }

        // ADMIN PIN LOGIC
        function openDatabase() { document.getElementById('pinInput').value = ''; document.getElementById('pinModal').classList.add('active'); document.getElementById('pinInput').focus(); }
        function closePinModal() { document.getElementById('pinModal').classList.remove('active'); }
        function verifyPin() { if (document.getElementById('pinInput').value === ADMIN_PIN) { closePinModal(); window.open(ADMIN_SHEET_URL, '_blank'); } else { alert("❌ Incorrect PIN!"); document.getElementById('pinInput').value = ''; } }
        document.getElementById('pinInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') verifyPin(); });

        // VAULT LOGIC
        function openPrizeVault() { document.getElementById('prizeVaultOverlay').style.display = 'flex'; document.getElementById('mysteryState').style.display = 'block'; document.getElementById('revealedState').style.display = 'none'; }
        function closePrizeVault() { document.getElementById('prizeVaultOverlay').style.display = 'none'; }
        function handleVaultClick(e) { if(e.target.id === 'prizeVaultOverlay' || e.target.id === 'revealedState') closePrizeVault(); }
        function revealPrizes() {
            document.getElementById('mysteryState').style.display = 'none'; document.getElementById('revealedState').style.display = 'block';
            const prizeGrid = document.getElementById('prizeGrid'); const noPrizeMsg = document.getElementById('noPrizeMsg'); prizeGrid.innerHTML = ''; 
            const winners = students.filter(s => parseInt(s.Points) >= 15);
            if (winners.length === 0) noPrizeMsg.style.display = 'block';
            else { noPrizeMsg.style.display = 'none'; winners.forEach((w, i) => { const c = document.createElement('div'); c.className = 'prize-card'; c.style.animationDelay = `${i * 0.15}s`; c.innerHTML = `<img src="${w.AvatarURL}"><h3>${w.Name}</h3><p>⭐ ${w.Points}</p>`; prizeGrid.appendChild(c); }); }
        }

        // KIOSK LOGIC (Physical Scans on Laptop)
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 200, height: 200} }, false);
        html5QrcodeScanner.render((decodedText) => {
            const student = students.find(s => s.Name.toLowerCase() === decodedText.trim().toLowerCase());
            if (!student) return;

            if (isAutoMode) {
                if (scannedThisSession.has(student.Name)) { const warning = document.getElementById('spamWarning'); warning.style.display = 'block'; setTimeout(() => warning.style.display = 'none', 3000); return; }
                scannedThisSession.add(student.Name);
                fetch(`${GOOGLE_WEB_APP_URL}?action=addPoints&name=${encodeURIComponent(student.Name)}&points=1`, { mode: 'no-cors' });
                
                // Beam the point instantly so phone knows too
                pubnub.publish({ channel: "classroom_channel", message: { action: "addPoints", name: student.Name, points: 1 } });
            } else {
                if (activeKioskStudent !== student.Name) {
                    triggerKioskPopup(student);
                    pubnub.publish({ channel: "classroom_channel", message: { action: "setActive", name: student.Name } });
                }
            }
        }, () => {});

        function triggerKioskPopup(student) {
            activeKioskStudent = student.Name;
            const popup = document.getElementById('kioskPopup');
            document.getElementById('kioskPopupName').innerHTML = `${student.Name}<br><span style="color: var(--yellow); font-size: 2rem;">⭐ ${student.Points}</span>`;
            document.getElementById('kioskPopupStatus').textContent = "Waiting for Teacher...";
            popup.style.display = 'block';
            
            // Show their art if they have it
            if (student.Artwork && student.Artwork !== "") { document.getElementById('artFrame').style.backgroundImage = `url('${student.Artwork}')`; document.getElementById('artFrame').style.display = 'block'; }
            clearTimeout(kioskTimer); kioskTimer = setTimeout(() => { activeKioskStudent = null; popup.style.display = 'none'; }, 10000);
        }

        function setAutoMode(state) {
            isAutoMode = state === 'on';
            if (isAutoMode) { document.getElementById('autoModeBadge').style.display = 'block'; document.getElementById('kioskLabel').textContent = "AUTO-SCAN: GET +1 POINT!"; document.getElementById('kioskLabel').style.color = "var(--green)"; } 
            else { scannedThisSession.clear(); document.getElementById('autoModeBadge').style.display = 'none'; document.getElementById('kioskLabel').textContent = "SCAN CARD HERE"; document.getElementById('kioskLabel').style.color = "var(--primary)"; }
        }

        // FETCH DATA (Now reduced to 15s since PubNub handles the speed!)
        async function fetchStudentData() {
            try {
                const response = await fetch(GOOGLE_WEB_APP_URL + '?action=get&t=' + new Date().getTime());
                const rawResponse = await response.json();
                
                setAutoMode(rawResponse.autoMode);

                students = rawResponse.students.map(s => ({ Name: s.Name, Points: s.Points, Artwork: s.Artwork, AvatarURL: s.AvatarURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(s.Name)}` }));
                
                updateArtworkLoop(); renderLeaderboard();
            } catch (error) {}
        }

        function processCelebrations() {
            if (isCelebrating || celebrationQueue.length === 0 || document.getElementById('prizeVaultOverlay').style.display === 'flex') return;
            isCelebrating = true;
            const event = celebrationQueue.shift();
            document.getElementById('celebrationAvatar').src = event.student.AvatarURL;
            document.getElementById('celebrationName').textContent = event.student.Name;
            document.getElementById('celebrationPoints').textContent = event.pointsGained;
            document.getElementById('celebrationBox').className = 'celebration-box anim-pop';
            document.getElementById('celebrationOverlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('celebrationOverlay').style.display = 'none'; isCelebrating = false; setTimeout(processCelebrations, 1000); }, 4000); 
        }

        // ARTWORK GALLERY
        function updateArtworkLoop() {
            const newArtList = students.filter(s => s.Artwork && s.Artwork.trim() !== "").map(s => s.Artwork);
            if (JSON.stringify(newArtList) !== JSON.stringify(artworkList)) {
                artworkList = newArtList;
                if (artworkList.length > 0) {
                    document.getElementById('noArtText').style.display = 'none';
                    if (!artInterval) { cycleArt(); artInterval = setInterval(cycleArt, 6000); }
                } else { document.getElementById('noArtText').style.display = 'block'; document.getElementById('artFrame').style.backgroundImage = 'none'; clearInterval(artInterval); artInterval = null; }
            }
        }
        function cycleArt() { if (artworkList.length === 0) return; document.getElementById('artFrame').style.backgroundImage = `url('${artworkList[artIndex]}')`; artIndex = (artIndex + 1) % artworkList.length; }

        // SCROLLING LEADERBOARD
        function renderLeaderboard() {
            const track = document.getElementById('scrollTrack'); const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) { wasSearching = true; track.style.animation = 'none'; track.innerHTML = buildCardsHTML(orderedStudents.filter(s => s.Name.toLowerCase().includes(searchTerm))); return; }
            track.style.animation = 'scrollUp 40s linear infinite';
            if (knownStudentCount !== students.length || wasSearching) {
                if (orderedStudents.length !== students.length) orderedStudents = shuffleArray([...students]);
                track.innerHTML = buildCardsHTML(orderedStudents) + buildCardsHTML(orderedStudents);
                knownStudentCount = students.length; wasSearching = false;
            } else { updateLeaderboardPoints(); }
        }
        function buildCardsHTML(arr) { return arr.map(s => `<div class="lb-card"><img src="${s.AvatarURL}"><h3>${s.Name}</h3><p class="pts-badge-${s.Name.replace(/\s+/g, '-')}">⭐ ${s.Points}</p></div>`).join(''); }
        function updateLeaderboardPoints() { students.forEach(s => { const safeName = s.Name.replace(/\s+/g, '-'); document.querySelectorAll(`.pts-badge-${safeName}`).forEach(b => b.innerHTML = `⭐ ${s.Points}`); }); }
        
        document.getElementById('searchInput').addEventListener('input', renderLeaderboard);

        fetchStudentData(); setInterval(fetchStudentData, 15000); 
    </script>
</body>
</html>
